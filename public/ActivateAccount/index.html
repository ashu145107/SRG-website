<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="utf-8">
  <title>सक्रिय करत आहे... / Activating...</title>
  <script>
    // Extract query string parameter 'd'
    const params = new URLSearchParams(window.location.search);
    const d = params.get('d');
    
    // Resolve base path dynamically to support both root and subfolder deployments
    const pathname = window.location.pathname; // E.g., "/ActivateAccount/" or "/myapp/ActivateAccount/"
    const basePath = pathname.replace(/\/ActivateAccount\/?$/i, ''); // E.g., "" or "/myapp"
    
    const redirectUrl = window.location.origin + basePath + '/#/ActivateAccount' + (d ? '?d=' + encodeURIComponent(d) : '');
    
    // Perform the redirect to the React hash-route
    window.location.replace(redirectUrl);
  </script>
</head>
<body>
  <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; margin-top: 100px; padding: 20px;">
    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #ea580c; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px auto;"></div>
    <h3 style="color: #1e293b; margin-bottom: 8px;">सक्रियकरण पृष्ठावर निर्देशित केले जात आहे...</h3>
    <p style="color: #64748b; font-size: 14px; margin-top: 0;">Redirecting to activation page, please wait...</p>
  </div>
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
